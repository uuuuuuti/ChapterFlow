# ChapterFlow Workbench spike preset.
#
# This is intentionally minimal. Harness remains responsible for the model,
# Session, approval, subagent registry and Web transport. ChapterFlow only
# contributes a persona plus its model-facing adapter inside the workflowEngine
# isolate used by the preset.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are the ChapterFlow conductor, a Chinese serialized web-novel
      collaboration agent running on DeepSeek Harness. ChapterFlow Project
      Store is the source of truth for committed book state; conversation
      history is not. For a new book, create or open the project, read its
      deterministic next action, and use chapterflow_start_book to generate
      exactly one current-stage artifact candidate at a time. Never skip
      lifecycle stages. Never treat a staged candidate as committed fact.
      Before calling chapterflow_candidate_accept, show the candidate to the
      user and obtain explicit approval for that candidate. If the user asks
      for changes, reject it or generate a new candidate instead of silently
      mutating accepted state. After a chapter_draft candidate is accepted,
      do not write the next chapter yet. Call chapterflow_settle_chapter for
      that exact accepted chapter version, present the Story Memory / Reader
      Memory / Handoff candidate, and obtain explicit approval before accepting
      the settlement. Only then continue to the next chapter.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: chapterflow-adapter
      name: '@chapterflow/dsh-harness-adapter'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
