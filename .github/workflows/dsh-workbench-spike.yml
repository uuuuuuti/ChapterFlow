name: DSH Workbench Spike

on:
  push:
    branches:
      - chapterflow/dsh-workbench-architecture
    paths:
      - "dsh-workbench/**"
      - ".github/workflows/dsh-workbench-spike.yml"
  pull_request:
    paths:
      - "dsh-workbench/**"
      - ".github/workflows/dsh-workbench-spike.yml"

jobs:
  adapter-spike:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-workbench

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pinned Harness alpha dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck Harness contracts
        run: npm run typecheck

      - name: Run adapter contract tests
        run: npm test

      - name: Install ChapterFlow plugins into isolated Harness profile
        run: npm run profile:init

      - name: Validate Harness profile composition
        run: |
          npm run profile:dump > /tmp/chapterflow-dsh-config.yml
          grep -q "chapterflow-client-ui" /tmp/chapterflow-dsh-config.yml
          grep -q "chapterflow-spike" /tmp/chapterflow-dsh-config.yml

      - name: Smoke boot Harness Web with ChapterFlow overlay
        run: |
          set -euo pipefail
          LOG=/tmp/chapterflow-dsh-web.log
          ./node_modules/.bin/dsh chapterflow \
            --patch ./apps/profile/web.cordis.patch.yml \
            --no-open \
            --host 127.0.0.1 \
            --port 3099 >"$LOG" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 25); do
            if grep -q "dsh web: http" "$LOG"; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$LOG"
              exit 1
            fi
            sleep 1
          done

          cat "$LOG"
          test "$READY" -eq 1
          AUTH_URL="$(sed -n 's/^dsh web: \(http[^ ]*\).*$/\1/p' "$LOG" | tail -n 1)"
          test -n "$AUTH_URL"
          curl --fail --location --silent --show-error "$AUTH_URL" > /tmp/chapterflow-dsh-index.html
          grep -qi "<html" /tmp/chapterflow-dsh-index.html
